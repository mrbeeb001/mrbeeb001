<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Mirror Lite</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #output_canvas { width: 100vw; height: 100vh; transform: scaleX(-1); object-fit: cover; }
    .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; }
    button { padding: 10px; border-radius: 10px; border: none; background: white; font-weight: bold; }
  </style>
</head>
<body>
  <video id="input_video" style="display:none" playsinline></video>
  <canvas id="output_canvas"></canvas>
  <div class="controls">
    <button onclick="changeShirt('shirt1.png')">S1</button>
    <button onclick="changeShirt('shirt2.png')">S2</button>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let currentShirt = new Image();
    currentShirt.src = 'shirt1.png';

    function changeShirt(src) { currentShirt.src = src; }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        const p11 = results.poseLandmarks[11];
        const p12 = results.poseLandmarks[12];
        
        // Agar shoulders screen se bahar hon to draw mat karo (Crash se bachnay ke liye)
        if(p11.visibility > 0.5 && p12.visibility > 0.5) {
            const w = Math.abs(p11.x - p12.x) * canvasElement.width;
            const sW = w * 2.5; 
            const sH = sW * 1.3;
            const cX = ((p11.x + p12.x) / 2) * canvasElement.width;
            const cY = ((p11.y + p12.y) / 2) * canvasElement.height;
            canvasCtx.drawImage(currentShirt, cX - (sW / 2), cY - (sH / 4), sW, sH);
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    // Mobile ke liye sab se behtreen settings
    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: false, // Performance barhanay ke liye band kiya
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        // Mobile screen ke mutabiq resolution set karna
        canvasElement.width = 480; 
        canvasElement.height = 640;
        await pose.send({image: videoElement});
      },
      width: 480, height: 640
    });
    camera.start();
  </script>
</body>
</html>

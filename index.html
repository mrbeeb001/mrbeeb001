<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Mirror - Super Lite</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #output_canvas { width: 100vw; height: 100vh; transform: scaleX(-1); object-fit: cover; }
    .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="loader" class="loading">Starting AI... Please Wait</div>
  <video id="input_video" style="display:none"></video>
  <canvas id="output_canvas"></canvas>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const loader = document.getElementById('loader');

    const shirtImage = new Image();
    shirtImage.src = 'shirt.png';

    function onResults(results) {
      loader.style.display = 'none'; // Hide loader once AI works
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];

        const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x) * canvasElement.width;
        const shirtWidth = shoulderWidth * 2.3; 
        const shirtHeight = shirtWidth * 1.3;

        const centerX = ((leftShoulder.x + rightShoulder.x) / 2) * canvasElement.width;
        const centerY = ((leftShoulder.y + rightShoulder.y) / 2) * canvasElement.height;

        canvasCtx.drawImage(shirtImage, centerX - (shirtWidth / 2), centerY - (shirtHeight / 4.5), shirtWidth, shirtHeight);
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 0,
      smoothLandmarks: false, // Performance barhanay ke liye smooth band kar di
      minDetectionConfidence: 0.4,
      minTrackingConfidence: 0.4
    });

    pose.onResults(onResults);

    // Frame skip logic
    let lastTime = 0;
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        const now = Date.now();
        // Sirf har 50ms baad frame process karo (Approx 20 FPS)
        if (now - lastTime > 50) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            await pose.send({image: videoElement});
            lastTime = now;
        }
      },
      width: 320, // Bohat low resolution for high speed
      height: 240
    });
    
    camera.start();
  </script>
</body>
</html>

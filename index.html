<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autographics AI Mirror - Final</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #output_canvas { width: 100vw; height: 100vh; transform: scaleX(-1); object-fit: cover; }
    
    .branding {
      position: absolute; top: 20px; width: 100%; text-align: center;
      color: white; z-index: 10; letter-spacing: 3px; font-weight: bold;
    }

    .controls-container {
      position: absolute; bottom: 30px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      z-index: 20;
    }

    .shirt-options {
      display: flex; gap: 10px; overflow-x: auto; padding: 10px; max-width: 90%;
    }

    .shirt-btn {
      min-width: 60px; height: 60px; background: rgba(255,255,255,0.2);
      border: 2px solid white; border-radius: 50%; cursor: pointer;
      color: white; font-size: 10px; backdrop-filter: blur(5px);
    }

    .capture-btn {
      width: 70px; height: 70px; background: #ff4757; border: 4px solid white;
      border-radius: 50%; cursor: pointer; box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
    }

    /* Flash Effect */
    #flash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; display: none; z-index: 200;
    }
  </style>
</head>
<body>

  <div id="flash"></div>
  <div class="branding">AUTOGRAPHICS VIRTUAL MIRROR</div>
  
  <video id="input_video" style="display:none" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <div class="controls-container">
    <!-- Shirt Selection -->
    <div class="shirt-options">
      <button class="shirt-btn" onclick="changeShirt('shirt.png')">S1</button>
      <button class="shirt-btn" onclick="changeShirt('shirt2.png')">S2</button>
      <button class="shirt-btn" onclick="changeShirt('shirt3.png')">S3</button>
    </div>

    <!-- Capture Button -->
    <button class="capture-btn" onclick="takeSnapshot()"></button>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const flash = document.getElementById('flash');

    let currentShirt = new Image();
    currentShirt.src = 'shirt.png';

    function changeShirt(src) { currentShirt.src = src; }

    // SNAPSHOT FUNCTION
    function takeSnapshot() {
        // Flash animation
        flash.style.display = 'block';
        setTimeout(() => { flash.style.display = 'none'; }, 100);

        // Download Image
        const link = document.createElement('a');
        link.download = 'autographics_mirror_shot.png';
        link.href = canvasElement.toDataURL();
        link.click();
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        const p11 = results.poseLandmarks[11];
        const p12 = results.poseLandmarks[12];

        const w = Math.abs(p11.x - p12.x) * canvasElement.width;
        const sW = w * 2.5; 
        const sH = sW * 1.35;
        const cX = ((p11.x + p12.x) / 2) * canvasElement.width;
        const cY = ((p11.y + p12.y) / 2) * canvasElement.height;

        canvasCtx.drawImage(currentShirt, cX - (sW / 2), cY - (sH / 4), sW, sH);
      }
      canvasCtx.restore();
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({ modelComplexity: 0, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        await pose.send({image: videoElement});
      },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
